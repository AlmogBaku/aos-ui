# Add this overlay to a harness overlay to enable Web Push. It sets the
# gateway's push environment variables, mounts the push state directory, and
# mounts the VAPID private key used by the Web Push implementation; the
# required variables follow the same operator-owned pattern as the other secret
# mounts. The private gateway configuration file needs no push section.
services:
  gateway:
    environment:
      HARNESS_GW_PUSH_STATE_DIR: /var/lib/harness-gw/push
      HARNESS_GW_PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private-key
      HARNESS_GW_PUSH_VAPID_SUBJECT: "${HARNESS_GW_PUSH_VAPID_SUBJECT:?Set HARNESS_GW_PUSH_VAPID_SUBJECT to the VAPID contact (mailto: or https:)}"
    volumes:
      # Bind-mount rather than a named volume: a named volume is initially
      # root-owned, but the gateway runs as the host UID.
      - type: bind
        source: ${HARNESS_GW_PUSH_STATE_DIR:?set HARNESS_GW_PUSH_STATE_DIR to an operator-owned directory}
        target: /var/lib/harness-gw/push
    secrets:
      - source: vapid-private-key
        target: vapid-private-key
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400

secrets:
  vapid-private-key:
    file: ${HARNESS_GW_VAPID_PRIVATE_KEY_FILE:?set HARNESS_GW_VAPID_PRIVATE_KEY_FILE to the VAPID private key file}
