# OpenClaw remains independently operated. This overlay runs the normalized AOS
# proxy and attaches it to the private Gateway endpoint without publishing a
# native port or passing device credentials through browser configuration.
services:
  web:
    user: "${AOS_UI_HOST_UID:-1000}:${AOS_UI_HOST_GID:-1000}"
    command:
      - bun
      - run
      - proxy:serve
      - --
      - --config
      - /run/aos-ui/proxy-config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${AOS_UI_GUEST_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_GUEST_PUBLISHED_PORT:-3001}:3001
    configs:
      - source: proxy-config
        target: /run/aos-ui/proxy-config.json
        mode: 0444
    secrets:
      - source: openclaw-device-identity
        target: openclaw-device-identity
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
      - source: openclaw-device-token
        target: openclaw-device-token
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
      - source: guest-invite-signing-key
        target: guest-invite-signing-key
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
      - source: vapid-private-key
        target: vapid-private-key
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
    volumes:
      # Bind-mount rather than a named volume: a named volume is initially
      # root-owned, but the proxy runs as the host UID.
      - type: bind
        source: ${AOS_UI_PUSH_STATE_DIR:?set AOS_UI_PUSH_STATE_DIR to an operator-owned directory}
        target: /var/lib/aos-ui/push
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/api/aos/v1/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

configs:
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.openclaw.json}
  proxy-config:
    file: ${AOS_UI_PROXY_CONFIG_FILE:?Set AOS_UI_PROXY_CONFIG_FILE to a private proxy configuration file}

secrets:
  openclaw-device-identity:
    file: ${AOS_UI_OPENCLAW_DEVICE_IDENTITY_FILE:?Set AOS_UI_OPENCLAW_DEVICE_IDENTITY_FILE to the private OpenClaw device identity file}
  openclaw-device-token:
    file: ${AOS_UI_OPENCLAW_DEVICE_TOKEN_FILE:?Set AOS_UI_OPENCLAW_DEVICE_TOKEN_FILE to the private OpenClaw device token file}
  guest-invite-signing-key:
    file: ${AOS_UI_GUEST_INVITE_SIGNING_KEY_FILE:?Set AOS_UI_GUEST_INVITE_SIGNING_KEY_FILE to the private guest invitation key file}
  vapid-private-key:
    file: ${AOS_UI_VAPID_PRIVATE_KEY_FILE:?set AOS_UI_VAPID_PRIVATE_KEY_FILE to the VAPID private key file}
