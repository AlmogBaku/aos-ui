name: aos-ui

services:
  # The only lane listener on the host: Caddy joins the app and, under a
  # harness overlay, the gateway on one origin per lane, and serves the MCP App
  # sandbox from a site of its own (deploy/Caddyfile).
  caddy:
    image: caddy:2.11-alpine
    environment:
      # Docker forwards a published port to the container's interface, so
      # Caddy listens on it here; the published ports below stay on loopback.
      AOS_UI_CADDY_BIND: 0.0.0.0
      # Never empty: an empty name leaves Caddy's host matcher with no host and
      # Caddy refuses to start. `localhost` adds nothing to the loopback names.
      AOS_UI_PUBLIC_HOST: ${AOS_UI_PUBLIC_HOST:-localhost}
      # The one MCP App sandbox address, for both lanes, which Caddy's sandbox
      # site sends to the web server whole; the web server below reads the
      # same value. It defaults to the sandbox site's published port.
      AOS_UI_MCP_APP_SANDBOX_ORIGIN: &sandbox-origin ${AOS_UI_MCP_APP_SANDBOX_ORIGIN:-http://sandbox.localhost:${AOS_UI_SANDBOX_PUBLISHED_PORT:-3002}}
      # Optional and off by default: the MCP App stable origins' wildcard,
      # whose exact stable hosts the sandbox site sends to the web server
      # whole, as it does the sandbox address. Empty, no host is one.
      AOS_UI_MCP_APP_STABLE_ORIGINS: &stable-origins ${AOS_UI_MCP_APP_STABLE_ORIGINS:-}
    ports:
      - ${AOS_UI_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_WEB_PUBLISHED_PORT:-3000}:18080
      # The MCP App sandbox site, which belongs to neither lane.
      - ${AOS_UI_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_SANDBOX_PUBLISHED_PORT:-3002}:18082
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
        mode: 0444
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:18080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true

  # The app's own server: the built pages, runtime-config.json with the served
  # build id, and the guest page policy. Reached only through Caddy.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      AOS_UI_STATIC_ROOT: /app/dist
      AOS_UI_RUNTIME_CONFIG_FILE: /run/aos-ui/runtime-config.json
      AOS_UI_WEB_HOST: 0.0.0.0
      AOS_UI_WEB_PORT: "4200"
      AOS_UI_WEB_EXPOSURE: private-container
      # Every origin people open AOS UI at, and the sandbox origin; both
      # default to loopback on their published ports. A harness overlay adds
      # the guest lane's loopback origins to the default.
      AOS_UI_PUBLIC_ORIGIN: ${AOS_UI_PUBLIC_ORIGIN:-http://localhost:${AOS_UI_WEB_PUBLISHED_PORT:-3000},http://127.0.0.1:${AOS_UI_WEB_PUBLISHED_PORT:-3000}}
      AOS_UI_MCP_APP_SANDBOX_ORIGIN: *sandbox-origin
      AOS_UI_MCP_APP_STABLE_ORIGINS: *stable-origins
    expose:
      - "4200"
    configs:
      - source: runtime-config
        target: /run/aos-ui/runtime-config.json
        mode: 0444
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:4200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

  # The UI's stateless tools MCP server. Harnesses on the host register
  # http://127.0.0.1:4110/mcp; Compose services reach http://tools-mcp:4110/mcp.
  # It has no authentication, so it is published on loopback only.
  tools-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools-mcp
    command:
      - bun
      - run
      - packages/tools-mcp/cli.ts
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "4110"
    environment:
      # Off while the stable origins are: with them and the URL the gateway
      # dials this server at, the artifact view declares a stable origin. That
      # URL defaults to the loopback one a harness on the host registers; a
      # harness overlay whose gateway dials another names it.
      AOS_UI_MCP_APP_STABLE_ORIGINS: *stable-origins
      AOS_UI_TOOLS_MCP_URL: ${AOS_UI_TOOLS_MCP_URL:-http://127.0.0.1:${AOS_UI_TOOLS_MCP_PORT:-4110}/mcp}
    ports:
      - 127.0.0.1:${AOS_UI_TOOLS_MCP_PORT:-4110}:4110
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:4110/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true

configs:
  caddyfile:
    file: ./deploy/Caddyfile
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.json}
