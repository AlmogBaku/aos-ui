name: aos-ui

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      AOS_UI_HERMES_HOST: ${AOS_UI_HERMES_HOST:-127.0.0.1}
      AOS_UI_HERMES_PORT: ${AOS_UI_HERMES_PORT:-9119}
    ports:
      - ${AOS_UI_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_WEB_PUBLISHED_PORT:-3000}:3000
    configs:
      - source: runtime-config
        target: /usr/share/nginx/html/runtime-config.json
        mode: 0444
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

configs:
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.json}
