# Hermes itself remains operator-managed. This overlay turns the Bun service
# into the private AOS translation boundary and static web server. External
# ingress owns TLS; only this listener is published by the Compose example.
services:
  web:
    command:
      - bun
      - run
      - proxy:serve
      - --
      - --config
      - /run/aos-ui/proxy-config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: proxy-config
        target: /run/aos-ui/proxy-config.json
        mode: 0444
    secrets:
      - source: operator-oidc-client-secret
        target: oidc-client-secret
        mode: 0400
      - source: operator-principal-hmac
        target: operator-principal-hmac
        mode: 0400
      - source: operator-session-key
        target: operator-session-key
        mode: 0400
      - source: reconnect-cursor-key
        target: reconnect-cursor-key
        mode: 0400
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/api/aos/v1/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

configs:
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.hermes.json}
  proxy-config:
    file: ${AOS_UI_PROXY_CONFIG_FILE:?Set AOS_UI_PROXY_CONFIG_FILE to a private proxy configuration file}

secrets:
  operator-oidc-client-secret:
    file: ${AOS_UI_OIDC_CLIENT_SECRET_FILE:?Set AOS_UI_OIDC_CLIENT_SECRET_FILE to an owner-only secret file}
  operator-principal-hmac:
    file: ${AOS_UI_OPERATOR_PRINCIPAL_KEY_FILE:?Set AOS_UI_OPERATOR_PRINCIPAL_KEY_FILE to an owner-only 32-byte key file}
  operator-session-key:
    file: ${AOS_UI_OPERATOR_SESSION_KEY_FILE:?Set AOS_UI_OPERATOR_SESSION_KEY_FILE to an owner-only 32-byte key file}
  reconnect-cursor-key:
    file: ${AOS_UI_RECONNECT_CURSOR_KEY_FILE:?Set AOS_UI_RECONNECT_CURSOR_KEY_FILE to an owner-only 32-byte key file}
