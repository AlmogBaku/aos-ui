# Hermes itself remains operator-managed. This overlay adds the harness-gw
# gateway in front of it and opens the guest lane: Caddy's guest site, the
# app's guest listener, and the gateway's guest listener. External ingress owns
# TLS; only Caddy's two lane ports are published.
services:
  gateway:
    image: ${HARNESS_GW_IMAGE:-ghcr.io/almogbaku/harness-gw:0.1.0}
    user: "${AOS_UI_HOST_UID:-1000}:${AOS_UI_HOST_GID:-1000}"
    environment:
      HARNESS_GW_CONFIG_FILE: /run/harness-gw/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4100"
      - "4101"
    configs:
      - source: gateway-config
        target: /run/harness-gw/config.yaml
        mode: 0444
    secrets:
      - source: hermes-token
        target: hermes-token
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
      - source: guest-invite-signing-key
        target: guest-invite-signing-key
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:4100/api/v1/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

  web:
    environment:
      AOS_UI_GUEST_WEB_HOST: 0.0.0.0
      AOS_UI_GUEST_WEB_PORT: "4201"
    expose:
      - "4201"

  caddy:
    environment:
      AOS_UI_GUEST_PUBLIC_HOST: ${AOS_UI_GUEST_PUBLIC_HOST:-localhost}
    ports:
      - ${AOS_UI_GUEST_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_GUEST_PUBLISHED_PORT:-3001}:18081
    configs:
      - source: caddy-guest-lane
        target: /etc/caddy/lanes/guest.caddy
        mode: 0444
    depends_on:
      gateway:
        condition: service_healthy

configs:
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.hermes.json}
  caddy-guest-lane:
    file: ./deploy/caddy/guest.caddy
  gateway-config:
    file: ${HARNESS_GW_CONFIG_FILE:?Set HARNESS_GW_CONFIG_FILE to a private harness-gw YAML configuration file}

secrets:
  hermes-token:
    file: ${HARNESS_GW_HERMES_TOKEN_FILE:?Set HARNESS_GW_HERMES_TOKEN_FILE to the private Hermes server-token file}
  guest-invite-signing-key:
    file: ${HARNESS_GW_GUEST_INVITE_SIGNING_KEY_FILE:?Set HARNESS_GW_GUEST_INVITE_SIGNING_KEY_FILE to the private guest invitation key file}
