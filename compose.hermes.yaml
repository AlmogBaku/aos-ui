# Hermes itself remains operator-managed. This overlay turns the Bun service
# into the private AOS translation boundary and static web server. External
# ingress owns TLS; only this listener is published by the Compose example.
services:
  web:
    user: "${AOS_UI_HOST_UID:-1000}:${AOS_UI_HOST_GID:-1000}"
    command:
      - bun
      - run
      - proxy:serve
      - --
      - --config
      - /run/aos-ui/proxy.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${AOS_UI_GUEST_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_GUEST_PUBLISHED_PORT:-3001}:3001
    configs:
      - source: proxy-config
        target: /run/aos-ui/proxy.yaml
        mode: 0444
    secrets:
      - source: hermes-token
        target: hermes-token
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
      - source: guest-invite-signing-key
        target: guest-invite-signing-key
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/api/aos/v1/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

configs:
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.hermes.json}
  proxy-config:
    file: ${AOS_UI_PROXY_CONFIG_FILE:?Set AOS_UI_PROXY_CONFIG_FILE to a private proxy YAML configuration file}

secrets:
  hermes-token:
    file: ${AOS_UI_HERMES_TOKEN_FILE:?Set AOS_UI_HERMES_TOKEN_FILE to the private Hermes server-token file}
  guest-invite-signing-key:
    file: ${AOS_UI_GUEST_INVITE_SIGNING_KEY_FILE:?Set AOS_UI_GUEST_INVITE_SIGNING_KEY_FILE to the private guest invitation key file}
