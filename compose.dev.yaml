# Runs the Vite dev server in place of the web server, behind the same Caddy
# sites: the operator site and the MCP App sandbox site, whose sandbox page and
# stable hosts Vite serves as the web server would. Vite serves the operator
# surface only, so the guest site, which a harness overlay opens, is served by
# `web-guest`: the production web server built from this checkout, without
# hot reload.
services:
  web:
    build:
      target: development
    command:
      - bun
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "4200"
    environment:
      AOS_UI_RUNTIME_CONFIG_FILE: /run/aos-ui/runtime-config.json
      # Only a harness overlay runs the gateway; fixture mode never calls it.
      AOS_UI_GATEWAY_TARGET: http://gateway:4100
    configs:
      - source: runtime-config
        target: /run/aos-ui/runtime-config.json
        mode: 0444
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: web-node-modules
        target: /app/node_modules

  # The guest page and its generated runtime-config, with the guest page
  # policy. Caddy reaches it only through the guest site.
  web-guest:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      AOS_UI_STATIC_ROOT: /app/dist
      AOS_UI_RUNTIME_CONFIG_FILE: /run/aos-ui/runtime-config.json
      AOS_UI_WEB_HOST: 0.0.0.0
      AOS_UI_WEB_PORT: "4200"
      AOS_UI_GUEST_WEB_HOST: 0.0.0.0
      AOS_UI_GUEST_WEB_PORT: "4201"
      AOS_UI_WEB_EXPOSURE: private-container
      # Every origin people open AOS UI at, the one sandbox origin, and the
      # optional stable origins, as the web service reads them; the origins
      # default to both lanes' loopback ones.
      AOS_UI_PUBLIC_ORIGIN: ${AOS_UI_PUBLIC_ORIGIN:-http://localhost:${AOS_UI_WEB_PUBLISHED_PORT:-3000},http://127.0.0.1:${AOS_UI_WEB_PUBLISHED_PORT:-3000},http://localhost:${AOS_UI_GUEST_PUBLISHED_PORT:-3001},http://127.0.0.1:${AOS_UI_GUEST_PUBLISHED_PORT:-3001}}
      AOS_UI_MCP_APP_SANDBOX_ORIGIN: ${AOS_UI_MCP_APP_SANDBOX_ORIGIN:-http://sandbox.localhost:${AOS_UI_SANDBOX_PUBLISHED_PORT:-3002}}
      AOS_UI_MCP_APP_STABLE_ORIGINS: ${AOS_UI_MCP_APP_STABLE_ORIGINS:-}
    expose:
      - "4201"
    configs:
      - source: runtime-config
        target: /run/aos-ui/runtime-config.json
        mode: 0444
    init: true

  caddy:
    environment:
      AOS_UI_WEB_GUEST_UPSTREAM: web-guest:4201

volumes:
  web-node-modules:
