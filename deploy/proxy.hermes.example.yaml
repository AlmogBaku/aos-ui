# Private AOS proxy configuration for the Hermes overlay. Every key is
# documented in docs/configuration.md. Copy this file outside the checkout,
# adjust the origins and the Hermes address, and keep it owner-only-writable
# (chmod 0600) and owned by the container uid or root. Secrets stay in the
# mounted files this config points at; never put a secret value here.
version: 1
deploymentId: aos-hermes-local
listen:
  host: 0.0.0.0
  port: 3000
  exposure: private-container
publicOrigin: http://127.0.0.1:3000
runtime:
  id: hermes-default
  kind: hermes
  baseUrl: http://host.docker.internal:9119
  tokenFile: /run/secrets/hermes-token
  sessionIdleMs: 300000
guest:
  listen:
    host: 0.0.0.0
    port: 3001
    exposure: private-container
  publicOrigin: http://127.0.0.1:3001
  invitations:
    keys:
      - id: current
        secretFile: /run/secrets/guest-invite-signing-key
    ttlSeconds: 259200
    clockSkewSeconds: 0
limits:
  activeExecutions: 256
  guestActiveExecutions: 32
  operatorEventPeers: 256
  subscriberEvents: 512
  subscriberBytes: 2097152
shutdownGraceMs: 5000
