# Host networking, used together with exactly one harness overlay
# (compose.hermes.yaml, compose.openclaw.yaml, or compose.opencode.yaml) and
# added after it, and after compose.push.yaml when push is enabled. With
# compose.opencode.yaml, also add deploy/compose.host.opencode.yaml after this
# file: Compose cannot amend a service that only one overlay defines.
#
# Compose ignores published ports here, so every listener binds loopback
# itself: Caddy keeps the Caddyfile's own 127.0.0.1 default on 18080 (and 18081
# for guests), its upstreams move from the Compose service names to the
# loopback ports, and the lanes' origins default to those two ports, the one
# sandbox origin to the operator's. The gateway's listeners come from its own
# configuration file, which must list 127.0.0.1 too. A host whose exit-node
# routes capture the Docker bridge subnets needs this shape, because a bridged,
# published port is unreachable; so does a gateway that reaches a Hermes on
# host loopback.
services:
  caddy:
    network_mode: host
    ports: !reset []
    environment:
      AOS_UI_CADDY_BIND: 127.0.0.1
      AOS_UI_GATEWAY_UPSTREAM: 127.0.0.1:4100
      AOS_UI_GATEWAY_GUEST_UPSTREAM: 127.0.0.1:4101
      AOS_UI_WEB_UPSTREAM: 127.0.0.1:4200
      AOS_UI_WEB_GUEST_UPSTREAM: 127.0.0.1:4201
      AOS_UI_MCP_APP_SANDBOX_ORIGIN: &sandbox-origin ${AOS_UI_MCP_APP_SANDBOX_ORIGIN:-http://sandbox.localhost:18080}

  web:
    network_mode: host
    expose: !reset []
    environment:
      AOS_UI_WEB_HOST: 127.0.0.1
      AOS_UI_GUEST_WEB_HOST: 127.0.0.1
      # On the host network a wildcard bind reaches every host interface, so
      # the bridged shape's acknowledgement does not carry over.
      AOS_UI_WEB_EXPOSURE: ""
      AOS_UI_PUBLIC_ORIGIN: ${AOS_UI_PUBLIC_ORIGIN:-http://127.0.0.1:18080,http://localhost:18080}
      AOS_UI_MCP_APP_SANDBOX_ORIGIN: *sandbox-origin
      AOS_UI_GUEST_PUBLIC_ORIGIN: ${AOS_UI_GUEST_PUBLIC_ORIGIN:-http://127.0.0.1:18081,http://localhost:18081}

  gateway:
    network_mode: host
    expose: !reset []
    extra_hosts: !reset []

  tools-mcp:
    network_mode: host
    ports: !reset []
    command:
      - bun
      - run
      - packages/tools-mcp/cli.ts
      - --http
      - --host
      - 127.0.0.1
      - --port
      - "4110"
