# This overlay runs the native OpenCode server beside the harness-gw gateway,
# which reaches it on the Compose network only, and opens the guest lane.
services:
  gateway:
    image: ${HARNESS_GW_IMAGE:-ghcr.io/almogbaku/harness-gw:0.1.1@sha256:5a5f1b800eb1155fa59d7bfd71a31ebad6cee6fdbf52957e9a6f5614d3a02750}
    user: "${AOS_UI_HOST_UID:-1000}:${AOS_UI_HOST_GID:-1000}"
    environment:
      HARNESS_GW_CONFIG_FILE: /run/harness-gw/config.yaml
    depends_on:
      opencode:
        condition: service_healthy
        restart: true
    expose:
      - "4100"
      - "4101"
    configs:
      - source: gateway-config
        target: /run/harness-gw/config.yaml
        mode: 0444
    secrets:
      - source: opencode-password
        target: opencode-password
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
      - source: guest-invite-signing-key
        target: guest-invite-signing-key
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:4100/api/v1/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true

  web:
    environment:
      AOS_UI_GUEST_WEB_HOST: 0.0.0.0
      AOS_UI_GUEST_WEB_PORT: "4201"
    expose:
      - "4201"

  caddy:
    environment:
      AOS_UI_GUEST_PUBLIC_HOST: ${AOS_UI_GUEST_PUBLIC_HOST:-localhost}
    ports:
      - ${AOS_UI_GUEST_BIND_ADDRESS:-127.0.0.1}:${AOS_UI_GUEST_PUBLISHED_PORT:-3001}:18081
    configs:
      - source: caddy-guest-lane
        target: /etc/caddy/lanes/guest.caddy
        mode: 0444
    depends_on:
      gateway:
        condition: service_healthy

  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        AOS_UI_HOST_GID: ${AOS_UI_HOST_GID:-1000}
        AOS_UI_HOST_UID: ${AOS_UI_HOST_UID:-1000}
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      AOS_UI_OPENAI_COMPATIBLE_API_KEY: ${AOS_UI_OPENAI_COMPATIBLE_API_KEY:-}
      AOS_UI_OPENAI_COMPATIBLE_BASE_URL: ${AOS_UI_OPENAI_COMPATIBLE_BASE_URL:-}
      AOS_UI_OPENAI_COMPATIBLE_MODEL_ID: ${AOS_UI_OPENAI_COMPATIBLE_MODEL_ID:-}
      AOS_UI_OPENCODE_HOST: 0.0.0.0
      AOS_UI_OPENCODE_PASSWORD_FILE: /run/secrets/opencode-password
      AOS_UI_OPENCODE_PORT: "4096"
      AOS_UI_OPENCODE_WORKTREE: /workspace
      AOS_UI_TOOLS_MCP_URL: http://tools-mcp:4110/mcp
      OPENCODE_SERVER_USERNAME: aos-ui
    depends_on:
      tools-mcp:
        condition: service_healthy
    expose:
      - "4096"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:4096/global/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    secrets:
      - source: opencode-password
        target: opencode-password
        uid: "${AOS_UI_HOST_UID:-1000}"
        gid: "${AOS_UI_HOST_GID:-1000}"
        mode: 0400
    volumes:
      - type: bind
        source: ${AOS_UI_OPENCODE_WORKTREE:?Set AOS_UI_OPENCODE_WORKTREE to the external OpenCode worktree}
        target: /workspace
      - type: bind
        source: ${AOS_UI_AWS_CONFIG_DIR:-${HOME}/.aws}
        target: /home/aos-ui/.aws
        read_only: true
      - type: volume
        source: opencode-data
        target: /home/aos-ui/.local/share/opencode

volumes:
  opencode-data:

configs:
  runtime-config:
    file: ${AOS_UI_RUNTIME_CONFIG_FILE:-./deploy/runtime-config.opencode.json}
  caddy-guest-lane:
    file: ./deploy/caddy/guest.caddy
  gateway-config:
    file: ${HARNESS_GW_CONFIG_FILE:?Set HARNESS_GW_CONFIG_FILE to a private harness-gw YAML configuration file}

secrets:
  opencode-password:
    file: ${HARNESS_GW_OPENCODE_PASSWORD_FILE:?Set HARNESS_GW_OPENCODE_PASSWORD_FILE to the private OpenCode server password file}
  guest-invite-signing-key:
    file: ${HARNESS_GW_GUEST_INVITE_SIGNING_KEY_FILE:?Set HARNESS_GW_GUEST_INVITE_SIGNING_KEY_FILE to the private guest invitation key file}
