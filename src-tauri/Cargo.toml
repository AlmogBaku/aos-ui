[package]
name = "aos-probe"
version = "0.1.0"
description = "ALM-109 throwaway device probe (Tauri 2, iOS + macOS)"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (Tauri's mobile template convention; needed on Windows, harmless elsewhere).
name = "aos_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

# Every version is pinned exactly; see NOTES.md for the list and sources.
[dependencies]
# `dynamic-acl` is what provides `Manager::add_capability` (it is also in tauri's
# default feature set; listed so the dependency is explicit).
tauri = { version = "=2.12.7", features = ["dynamic-acl"] }
tauri-plugin-http = { version = "=2.9.0", features = ["unsafe-headers"] }
tauri-plugin-websocket = "=2.5.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-process = "=2.4.0"
# `default-features = false` turns off `notify-rust`, which is what selects the
# native macOS backend (the only macOS backend with APNs); `push-notifications`
# enables APNs on iOS and macOS. Linux always uses notify-rust regardless.
tauri-plugin-notifications = { version = "=0.5.0-rc.17", default-features = false, features = ["push-notifications"] }
# The websocket plugin exposes no Rust API to wrap, so the shell dials with the
# same library and TLS stack the plugin uses (tokio-tungstenite 0.29 + rustls/ring
# + webpki roots). See NOTES.md.
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", features = ["net", "sync", "time"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.9"
