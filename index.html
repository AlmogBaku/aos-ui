<!doctype html>
<html lang="en" dir="ltr" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="A multilingual workspace for provider-owned AI agents and sessions."
    />
    <!--
      The installed window's title bar is browser chrome outside the page, so no
      CSS rule reaches it and a meta tag cannot resolve a custom property.
      `titleBarColorPlugin` fills these from `--sidebar` in
      `src/app/globals.css`, the surface the title bar meets at both top corners.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="%AOS_TITLE_BAR_LIGHT%"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="%AOS_TITLE_BAR_DARK%"
    />
    <link rel="icon" href="/logo-adaptive.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <title>AOS</title>
    <!--
      The first paint, before any script or stylesheet arrives. It copies the
      light tokens from `src/app/globals.css` and must stay visually identical
      to `LoadingWorkspace` in `src/app/app.tsx`, which renders before the theme
      does; React's first render replaces it. The `:has` rules stop matching then.
    -->
    <style>
      html:has(#aos-first-paint),
      body:has(#aos-first-paint) {
        margin: 0;
        overflow: hidden;
        background: oklch(0.955 0.006 265);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #aos-first-paint {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        background: oklch(0.99 0.002 265);
        color: oklch(0.5 0.012 265);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      @media (min-width: 64rem) {
        body:has(#aos-first-paint) {
          padding: 1rem;
        }
      }
      @media (display-mode: standalone),
        (display-mode: minimal-ui),
        (display-mode: window-controls-overlay) {
        body:has(#aos-first-paint) {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="aos-first-paint" role="status">Loading workspace…</main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
