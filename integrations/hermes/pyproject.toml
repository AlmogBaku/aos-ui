[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-hermes"
version = "0.1.0"
description = "Native Hermes tools for AOS."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.26.0,<5",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aos_hermes*"]

[tool.setuptools.package-data]
aos_hermes = ["_generated/*.json", "_generated/*.md"]
