[build-system]
requires = ["uv_build>=0.10.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "monty"
version = "0.1.0"
description = "Execute MCP tools in Python with builtins and adaptive search."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26.0,<2",
  "pydantic-monty==0.0.21",
  "datamodel-code-generator>=0.54.0",
]

[project.optional-dependencies]
semantic = ["lancedb>=0.29.2", "sentence-transformers>=3.0.0"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = "src"
