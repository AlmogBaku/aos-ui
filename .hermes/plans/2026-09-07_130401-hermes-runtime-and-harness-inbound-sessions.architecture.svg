<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc"><title id="title">Hermes Profiles mapped to AOS multi-agent identities and trusted inbound session architecture</title><desc id="desc">A configured allowlist maps isolated Hermes Profiles to stable AOS Agents. Browser and trusted harness requests select an AOS Agent, which the AOS server resolves to exactly one Profile, profile-scoped API route, and server-only key. Hermes confirms sessions under that Profile.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><style>.n{font:600 16px Arial,sans-serif;fill:#f8fafc}.s{font:12px Arial,sans-serif;fill:#cbd5e1}.tiny{font:11px Arial,sans-serif;fill:#94a3b8}.tag{font:700 10px Arial,sans-serif;letter-spacing:.7px;fill:#0f172a}.profile{font:700 12px Arial,sans-serif;fill:#ede9fe}.mono{font:600 10px 'Courier New',monospace;fill:#d8b4fe}</style></defs><rect width="1240" height="690" rx="16" fill="#020617"/><rect width="1240" height="690" rx="16" fill="url(#grid)" opacity=".75"/><text x="36" y="42" class="n" font-size="20">Profile-scoped authoritative session flow</text><text x="36" y="66" class="s">Hermes Profiles are isolated agents; AOS mirrors the configured allowlist as stable multi-agent identities</text><g fill="none" stroke-linecap="round"><path d="M270 226H394" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/><path d="M270 448H394" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-amber)"/><path d="M698 226H810" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/><path d="M698 448H810" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/><path d="M998 336V364" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/></g><g><rect x="42" y="160" width="228" height="132" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><rect x="42" y="160" width="228" height="132" rx="12" fill="#083344" opacity=".55"/><circle cx="70" cy="188" r="8" fill="#22d3ee"/><text x="88" y="194" class="n">AOS browser</text><text x="62" y="224" class="s">Selects an AOS Agent</text><text x="62" y="246" class="s">Catalog + SSE UI</text><text x="62" y="272" class="tiny">Same-origin calls only</text><rect x="42" y="398" width="228" height="98" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><rect x="42" y="398" width="228" height="98" rx="12" fill="#78350f" opacity=".42"/><circle cx="70" cy="426" r="8" fill="#fbbf24"/><text x="88" y="432" class="n">Trusted harness</text><text x="62" y="462" class="s">Requests allowlisted agent_id</text><text x="62" y="482" class="tiny">Signed timestamp / nonce</text></g><g><rect x="394" y="112" width="304" height="430" rx="16" fill="#0f172a" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5"/><text x="418" y="142" class="tiny" fill="#fda4af">AOS SERVER TRUST BOUNDARY</text><rect x="420" y="164" width="252" height="102" rx="10" fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/><text x="442" y="194" class="n">Profile resolver</text><text x="442" y="217" class="s">AOS Agent ID → exact Profile</text><text x="442" y="240" class="mono">keys[profile] · server-only</text><rect x="420" y="294" width="252" height="98" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/><text x="442" y="324" class="n">Hermes API proxy</text><text x="442" y="347" class="mono">/p/&lt;profile&gt;/api/sessions</text><text x="442" y="370" class="tiny">Allowlisted paths · preserves SSE</text><rect x="420" y="420" width="252" height="96" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/><text x="442" y="450" class="n">Inbound session ingress</text><text x="442" y="473" class="s">Resolve + create + read-back</text><text x="442" y="496" class="tiny">Opaque ID + AOS route only</text></g><g><rect x="810" y="112" width="364" height="430" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><rect x="810" y="112" width="364" height="430" rx="16" fill="#4c1d95" opacity=".18"/><circle cx="838" cy="144" r="8" fill="#a78bfa"/><text x="856" y="150" class="n">Hermes Profile catalog</text><text x="834" y="178" class="s">Configured allowlist → immutable AOS Agents</text><rect x="834" y="198" width="316" height="54" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/><text x="852" y="221" class="profile">profile: research</text><text x="852" y="241" class="tiny">AOS Agent: research · isolated state + memory + skills</text><rect x="834" y="264" width="316" height="54" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/><text x="852" y="287" class="profile">profile: operations</text><text x="852" y="307" class="tiny">AOS Agent: operations · isolated config + credentials + sessions</text><rect x="834" y="330" width="316" height="54" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/><text x="852" y="353" class="profile">profile: &lt;allowlisted profile&gt;</text><text x="852" y="373" class="tiny">Stable slug identity; no fabricated default agent</text><rect x="834" y="396" width="316" height="94" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.2"/><text x="852" y="424" class="n">Hermes API Server</text><text x="852" y="448" class="s">Profile-scoped sessions · history · chat</text><text x="852" y="470" class="s">Runs · stop · capabilities</text><text x="834" y="520" class="tiny">Loopback / private service networking only</text></g><g><rect x="284" y="204" width="90" height="24" rx="12" fill="#cffafe"/><text x="300" y="220" class="tag">AGENT ID</text><rect x="284" y="426" width="90" height="24" rx="12" fill="#fef3c7"/><text x="294" y="442" class="tag">AUTHENTICATED</text><rect x="706" y="204" width="90" height="24" rx="12" fill="#ede9fe"/><text x="718" y="220" class="tag">RESOLVED</text><rect x="706" y="426" width="90" height="24" rx="12" fill="#d1fae5"/><text x="716" y="442" class="tag">CREATE / GET</text></g><rect x="42" y="576" width="1132" height="76" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/><text x="66" y="606" class="n">Ownership rule</text><text x="66" y="630" class="s">Provider list/get responses confirm a session belongs to the resolved Profile/AOS Agent; visible-tab polling discovers it without focus theft.</text></svg>